<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>List of Reports - TraceBack</title>
  <style>
    :root{ --tb-primary:#1b6dc1; --tb-dark:#1b263b; --tb-muted:#6b7280; --tb-bg:#f5f9fc; }
    body { margin: 0; font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--tb-bg); }
    header { display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; background: #f0f4f8; border-bottom: 2px solid #ccc; }
    .logo img { height: 75px; }
    nav { flex: 1; text-align: center; }
    nav a { text-decoration: none; margin: 0 10px; padding: 8px 18px; background: #eaeaea; border-radius: 8px; font-weight: bold; color: #333; }
    nav a:hover { background: #dcdcdc; }
    .logout-btn { background: #ccc; padding: 8px 16px; border-radius: 8px; text-decoration: none; color: #333; font-weight: bold; cursor: pointer; }

    .content { padding: 40px; }
    h2 { text-align: center; color: #1b263b; margin-bottom: 20px; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; background: #fff; box-shadow: 0 4px 10px rgba(0,0,0,0.2); border-radius: 8px; overflow: hidden; }
    th, td { border: 1px solid #ccc; padding: 10px; text-align: left; font-size: 15px; }
    th { background: #eef4f8; }
    tr:nth-child(even) { background: #f9f9f9; }
    img { max-width: 80px; border-radius: 6px; }
    button { padding: 6px 14px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 14px; }
    .found-btn { background: #4caf50; color: white; }
    .claim-btn { background: #1b6dc1; color: white; margin-left: 6px; }

    /* ===== Chat Widget ===== */
    .tb-fab{
      position: fixed; right: 22px; bottom: 22px; z-index: 1200;
      width: 56px; height: 56px; border-radius: 50%;
      background: var(--tb-primary); color:#fff; border:none; box-shadow:0 10px 24px rgba(27,109,193,.35);
      display:flex; align-items:center; justify-content:center; font-size:20px; cursor:pointer;
    }
    .tb-window{
      position: fixed; right: 22px; bottom: 22px; z-index: 1201;
      width: 920px; max-width: 96vw; height: 560px; max-height: 78vh;
      background:#fff; border:1px solid #e5e7eb; border-radius: 14px;
      box-shadow: 0 15px 40px rgba(0,0,0,.2); display: none;
    }
    .tb-window.open{ display:block; }
    .tb-head{
      height:56px;
      background: linear-gradient(90deg, #f8fafc, #eef2ff);
      border-bottom:1px solid #e5e7eb;
      display:flex; align-items:center; justify-content:space-between; padding:0 12px 0 14px;
    }
    .tb-head .logo{width:30px;height:30px;border-radius:8px;background:var(--tb-dark);color:#fff;display:grid;place-items:center;font-weight:700;}
    .tb-head .title{font-weight:600;font-size:14px;}
    .tb-head .subtitle{font-size:11px;color:var(--tb-muted);}
    .tb-head .actions button{background:#fff;border:1px solid #e5e7eb;color:#333;border-radius:8px;padding:6px 8px;margin-left:6px;cursor:pointer;}
    .tb-body{display:grid; grid-template-columns: 320px 1fr; height: calc(100% - 56px);}
    .tb-side{border-right:1px solid #e5e7eb; display:flex; flex-direction:column;}
    .tb-tabs{padding:10px;}
    .tb-tab-wrap{display:grid; grid-template-columns:1fr 1fr; gap:8px; background:#f3f4f6; border-radius:12px; padding:6px;}
    .tb-tabs .tab{width:50%; padding:10px 0; border-radius:10px; font-weight:600; font-size:13px; cursor:pointer; border:1px solid #e5e7eb; background:#fff;}
    .tb-tabs .tab.active{background:#fff;color:#111; box-shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.05); border-color:#d1d5db;}
    .tb-search{padding:0 12px 10px;}
    .tb-search input{width:100%; padding:9px 12px; border:1px solid #e5e7eb; border-radius:10px; font-size:13px;}
    .tb-list{overflow:auto;}
    .tb-item{display:flex; gap:10px; padding:10px 12px; border-top:1px solid #f1f5f9; cursor:pointer;}
    .tb-item:hover{background:#f8fafc;}
    .tb-item.active{background:#eef2ff;}
    .tb-avatar{width:42px;height:42px;border-radius:999px;background:#e5e7eb;display:grid;place-items:center;font-weight:700;}
    .tb-meta{flex:1; min-width:0;}
    .tb-name{font-weight:600; font-size:14px;}
    .tb-pill{font-size:10px; border:1px solid #e5e7eb; padding:2px 6px; border-radius:999px; color:#374151;}
    .tb-conv{display:flex; flex-direction:column;}
    .tb-conv-head{display:flex; align-items:center; gap:10px; padding:10px 12px; border-bottom:1px solid #e5e7eb;}
    .tb-status{margin-left:auto; display:flex; gap:6px;}
    .tb-status button{font-size:11px; padding:4px 8px; border:1px solid #e5e7eb; border-radius:8px; background:#fff; cursor:pointer;}
    .tb-status button.active{background:var(--tb-primary); color:#fff; border-color:var(--tb-primary);}
    .tb-messages{flex:1; overflow:auto; background:linear-gradient(#fff,#f8fafc); padding:16px;}
    .tb-bubble{max-width:72%; padding:10px 12px; border-radius:14px; margin:6px 0; font-size:14px; line-height:1.35; box-shadow:0 1px 2px rgba(0,0,0,.05);}
    .tb-bubble.me{margin-left:auto; background:var(--tb-primary); color:#fff;}
    .tb-bubble.them{margin-right:auto; background:#eef2ff; color:#111;}
    .tb-compose{border-top:1px solid #e5e7eb; padding:10px; display:flex; gap:10px;}
    .tb-compose textarea{flex:1; resize:none; min-height:38px; max-height:110px; border:1px solid #e5e7eb; border-radius:10px; padding:9px 10px; font-size:14px;}
    .tb-send{background:var(--tb-primary); color:#fff; padding:10px 16px; border-radius:10px; font-weight:700;}
    .tb-send:disabled{background:#9bbde2;}
  </style>
</head>

<body>

<header>
  <div class="logo"><a href="admin.html"><img src="TRACEBACK.png" alt="TraceBack Logo"></a></div>
  <nav>
    <a href="add.html">Add Item</a>
    <a href="record.html" style="background:#1b263b; color:white;">Reports</a>
    <a href="camera.html">View Camera</a>
  </nav>
  <a href="#" class="logout-btn" onclick="alert('Logout handled in main page.')">Log Out</a>
</header>

<div class="content">
  <h2>List of Reports</h2>
  <table id="reportTable">
    <thead>
      <tr>
        <th>Ticket</th><th>Name</th><th>Email</th><th>Item</th><th>Description</th>
        <th>Location & Date</th><th>Photo</th><th>Status</th><th>Actions</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

<!-- Chat Widget -->
<button id="tbFab" class="tb-fab" title="Open inbox">💬</button>
<div id="tbChat" class="tb-window" aria-hidden="true">
  <div class="tb-head">
    <div class="brand"><div class="logo">TB</div><div><div class="title">Inbox</div><div class="subtitle">Customers & Tickets</div></div></div>
    <div class="actions"><button id="tbMin">–</button><button id="tbClose">✕</button></div>
  </div>
  <div class="tb-body">
    <aside class="tb-side">
      <div class="tb-tabs"><div class="tb-tab-wrap"><button id="tabContact" class="tab">Contact</button><button id="tabTickets" class="tab active">Tickets</button></div></div>
      <div class="tb-search"><input id="tbSearch" placeholder="Search…" /></div>
      <div id="tbList" class="tb-list"></div>
    </aside>
    <section class="tb-conv">
      <div class="tb-conv-head"><div class="tb-avatar">T</div><div><div id="tbTitle" class="tb-conv-title">Select a conversation</div></div>
      <div class="tb-status" id="tbStatusBtns" style="display:none"><button data-status="Open">Open</button><button data-status="Pending">Pending</button><button data-status="Resolved">Resolved</button></div></div>
      <div id="tbMessages" class="tb-messages"></div>
      <div class="tb-compose"><textarea id="tbInput" placeholder="Type a message… (Enter to send)"></textarea><button id="tbSend" class="tb-send" disabled>Send</button></div>
    </section>
  </div>
</div>

<script>
  const CLAIMED_STATES=["Resolved","Claimed"];
  const isClaimed=r=>CLAIMED_STATES.includes((r.status||"").trim());
  const tbody=document.querySelector("#reportTable tbody");

  function loadReports(){
    let r=JSON.parse(localStorage.getItem("reports")||"[]");
    r.forEach((x,i)=>{if(!x.ticketId)x.ticketId="TKT-"+(Date.now().toString().slice(-6))+"-"+i;if(!x.status)x.status="Open";});
    localStorage.setItem("reports",JSON.stringify(r));
    return r;
  }
  function saveReports(r){localStorage.setItem("reports",JSON.stringify(r));}

  function renderTable(){
    const reports=loadReports().filter(r=>!isClaimed(r)).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
    tbody.innerHTML="";
    if(!reports.length){tbody.innerHTML='<tr><td colspan="9" style="text-align:center;color:#777;">No active reports</td></tr>';return;}
    reports.forEach(r=>{
      tbody.insertAdjacentHTML('beforeend',`
      <tr data-ticket="${r.ticketId}">
        <td>${r.ticketId}</td><td>${r.name||""}</td><td>${r.email||""}</td>
        <td>${r.item||""}</td><td>${r.desc||""}</td>
        <td>${r.location||""}${r.date?", "+r.date:""}</td>
        <td>${r.photo?`<img src="${r.photo}">`:"No Photo"}</td>
        <td class="status-cell">${r.status}</td>
        <td><button class="found-btn">Found Item</button><button class="claim-btn">Claim</button></td>
      </tr>`);});
  }

  document.getElementById("reportTable").addEventListener("click",e=>{
    const row=e.target.closest("tr");if(!row)return;
    const id=row.dataset.ticket;
    let r=loadReports();const i=r.findIndex(x=>x.ticketId===id);if(i<0)return;
    if(e.target.classList.contains("found-btn")){
      openChat();setTab("tickets");openThread({id,type:"ticket"});
      const m=`Hello ${r[i].name||"there"}, your item "${r[i].item||""}" was found at ${r[i].location||"the station"}${r[i].date?` (${r[i].date})`:""}.`;
      INPUT.value=m;SEND.disabled=false;INPUT.focus();
    }
    if(e.target.classList.contains("claim-btn")){
      r[i].status="Resolved";saveReports(r);row.remove();if(!tbody.querySelector("tr"))renderTable();renderList();
    }
  });

  window.addEventListener("storage",e=>{if(e.key==="reports"){renderTable();renderList();}});

  const CHAT=document.getElementById("tbChat"),FAB=document.getElementById("tbFab"),BTN_CLOSE=document.getElementById("tbClose"),BTN_MIN=document.getElementById("tbMin");
  const TAB_CONTACT=document.getElementById("tabContact"),TAB_TICKETS=document.getElementById("tabTickets"),LIST=document.getElementById("tbList");
  const INPUT_SEARCH=document.getElementById("tbSearch"),INPUT=document.getElementById("tbInput"),SEND=document.getElementById("tbSend");
  const MSGS=document.getElementById("tbMessages"),TITLE=document.getElementById("tbTitle"),STATUS_BTNS=document.getElementById("tbStatusBtns");
  let currentTab="tickets",selectedThread=null;
  FAB.onclick=()=>CHAT.classList.add("open");
  BTN_CLOSE.onclick=BTN_MIN.onclick=()=>CHAT.classList.remove("open");

  function setTab(n){currentTab=n;TAB_CONTACT.classList.toggle("active",n==="contact");TAB_TICKETS.classList.toggle("active",n==="tickets");renderList();}
  TAB_CONTACT.onclick=()=>setTab("contact");
  TAB_TICKETS.onclick=()=>setTab("tickets");
  INPUT.oninput=()=>SEND.disabled=!INPUT.value.trim();
  INPUT.onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();doSend();}};
  SEND.onclick=doSend;INPUT_SEARCH.oninput=renderList;

  function fmtTime(t){try{return new Date(t).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});}catch{return"";}}
  function renderList(){
    const q=(INPUT_SEARCH.value||"").toLowerCase();LIST.innerHTML="";
    const reports=loadReports().filter(r=>!isClaimed(r)).filter(r=>(r.item||"").toLowerCase().includes(q));
    if(!reports.length){LIST.innerHTML='<div class="tb-item"><div>No tickets</div></div>';return;}
    reports.forEach(r=>{
      const row=document.createElement("div");row.className="tb-item";row.innerHTML=`<div class="tb-avatar">T</div><div class="tb-meta"><div class="tb-name">${r.ticketId}</div><div class="tb-pill">${r.status}</div></div>`;
      row.onclick=()=>openThread({id:r.ticketId,type:"ticket"});LIST.appendChild(row);
    });
  }

  function openThread(t){
    selectedThread=t;MSGS.innerHTML="";
    const r=loadReports().find(x=>x.ticketId===t.id);if(!r||isClaimed(r)){renderTable();renderList();return;}
    TITLE.textContent=t.id;STATUS_BTNS.style.display="flex";
  }

  function doSend(){
    if(!selectedThread)return;const text=INPUT.value.trim();if(!text)return;
    const arr=JSON.parse(localStorage.getItem("tb_ticket_"+selectedThread.id)||"[]");
    arr.push({text,at:new Date().toISOString(),by:"admin"});localStorage.setItem("tb_ticket_"+selectedThread.id,JSON.stringify(arr));
    INPUT.value="";SEND.disabled=true;
  }

  renderTable();renderList();
</script>
</body>
</html>
